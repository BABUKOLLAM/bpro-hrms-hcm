# fail2ban filter for repeated failed Odoo logins.
#
# Matches the exact log line Odoo's own auth code emits on a failed
# login (odoo/addons/base/models/res_users.py):
#   _logger.info("Login failed for db:%s login:%s from %s", db, login, ip)
# rendered as:
#   ... INFO <db> odoo.addons.base.models.res_users: Login failed for db:<db> login:<user> from <ip>
#
# Install to /etc/fail2ban/filter.d/odoo-auth.conf on the host.

[Definition]
failregex = ^.*odoo\.addons\.base\.models\.res_users: Login failed for db:\S+ login:\S+ from <HOST>\s*$
ignoreregex =
